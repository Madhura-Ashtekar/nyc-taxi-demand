[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "taxidemand"
version = "0.1.0"
description = "Spatio-temporal forecasting of NYC taxi demand per zone and hour"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.14"
authors = [{ name = "Madhura Ashtekar" }]
dependencies = [
    "httpx>=0.27",
    "pyarrow>=16.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
taxidemand = "taxidemand.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/taxidemand"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PTH"]
